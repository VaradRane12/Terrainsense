<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerrainSense Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1532 100%);
            color: #d5ffe8;
            font-family: 'Courier New', monospace;
            padding: 12px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 16px;
            border-bottom: 2px solid #00ff99;
            padding-bottom: 12px;
        }
        
        .header h1 {
            color: #00ff99;
            font-size: 28px;
            margin-bottom: 4px;
        }
        
        .header-status {
            font-size: 12px;
            color: #888;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .video-container {
            border: 2px solid #00ff99;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        
        .video-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .panel {
            border: 1px solid #00ff99;
            border-radius: 6px;
            padding: 12px;
            background: rgba(0, 255, 153, 0.05);
        }
        
        .panel-title {
            font-size: 12px;
            color: #00ff99;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            border-bottom: 1px solid #00ff99;
            padding-bottom: 6px;
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        button {
            padding: 8px 12px;
            background: rgba(0, 255, 153, 0.15);
            border: 1px solid #00ff99;
            color: #00ff99;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        
        button:hover {
            background: #00ff99;
            color: #0a0e27;
            box-shadow: 0 0 10px rgba(0, 255, 153, 0.5);
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        button.active {
            background: #00ff99;
            color: #0a0e27;
        }
        
        .status-text {
            font-size: 11px;
            color: #aaa;
            margin-top: 6px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 3px;
            max-height: 60px;
            overflow-y: auto;
        }
        
        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        
        .sensor-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 3px;
            border-left: 2px solid #00ff99;
        }
        
        .sensor-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
        }
        
        .sensor-value {
            font-size: 14px;
            color: #00ff99;
            font-weight: bold;
            margin-top: 2px;
        }
        
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        
        
        .data-panels {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }
        
        .info-table {
            width: 100%;
            font-size: 11px;
            border-collapse: collapse;
        }
        
        .info-table tr {
            border-bottom: 1px solid rgba(0, 255, 153, 0.1);
        }
        
        .info-table td {
            padding: 4px 0;
        }
        
        .info-table td:first-child {
            color: #888;
            width: 50%;
        }
        
        .info-table td:last-child {
            color: #00ff99;
            font-weight: bold;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ TerrainSense</h1>
            <div class="header-status" id="appStatus">Ready</div>
        </div>
        
        <div class="main-grid">
            <div class="video-container">
                <img src="/video_feed" alt="Live Video Stream">
            </div>
            
            <div class="sidebar">
                <!-- App Control Panel -->
                <div class="panel">
                    <div class="panel-title">App Control</div>
                    <div class="button-group">
                        <button id="appStartBtn" onclick="appStart()">▶ Start</button>
                        <button id="appStopBtn" onclick="appStop()">⏹ Stop</button>
                    </div>
                    <div class="status-text" id="appStatus"></div>
                </div>
                
                <!-- Voice Control Panel -->
                <div class="panel">
                    <div class="panel-title">Voice</div>
                    <div class="button-group">
                        <button onclick="voiceOn()">Voice ON</button>
                        <button onclick="voiceOff()">Voice OFF</button>
                        <button onclick="voiceTest()">Test</button>
                    </div>
                    <div class="status-text" id="voiceStatus">-</div>
                </div>
                
                <!-- Audio Control Panel -->
                <div class="panel">
                    <div class="panel-title">Audio</div>
                    <div class="button-group">
                        <button onclick="audioAux()">Use AUX</button>
                    </div>
                    <div class="status-text" id="audioStatus">-</div>
                </div>
                
                <!-- Recording Panel -->
                <div class="panel">
                    <div class="panel-title">Recording</div>
                    <input type="number" id="recMinutes" value="5" min="1" style="width:100%; padding:6px; border:1px solid #00ff99; background:#000; color:#00ff99; border-radius:3px; margin-bottom:6px;">
                    <div class="button-group">
                        <button onclick="recordStart()">Record ON</button>
                        <button onclick="recordStop()">Record OFF</button>
                    </div>
                    <div class="status-text" id="recordStatus">-</div>
                </div>
                
                <!-- Stabilization Panel -->
                <div class="panel">
                    <div class="panel-title">Video</div>
                    <div class="button-group">
                        <button onclick="stabOn()">Stabilize ON</button>
                        <button onclick="stabOff()">Stabilize OFF</button>
                    </div>
                    <div class="status-text" id="stabStatus">-</div>
                </div>
            </div>
        </div>
        
        <!-- Sensor Data Panels -->
        <div class="data-panels">
            <!-- ToF Sensor -->
            <div class="panel">
                <div class="panel-title">📡 ToF Sensor</div>
                <table class="info-table">
                    <tr>
                        <td>Front Distance</td>
                        <td id="tofDistance">-</td>
                    </tr>
                    <tr>
                        <td>Valid Cells</td>
                        <td id="tofValidCells">-</td>
                    </tr>
                </table>
            </div>
            
            <!-- IMU Sensor -->
            <div class="panel">
                <div class="panel-title">🎯 IMU Orientation</div>
                <table class="info-table">
                    <tr>
                        <td>Pitch</td>
                        <td id="imuPitch">-</td>
                    </tr>
                    <tr>
                        <td>Yaw</td>
                        <td id="imuYaw">-</td>
                    </tr>
                </table>
            </div>
            
            <!-- System Status -->
            <div class="panel">
                <div class="panel-title">📊 System Info</div>
                <table class="info-table">
                    <tr>
                        <td>Sensor Update</td>
                        <td id="sensorUpdate">-</td>
                    </tr>
                    <tr>
                        <td>Last Error</td>
                        <td id="sensorError">-</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
    
    <script>
        // ── App State Management ──
        let appState = {
            running: false,
            lastSensorUpdate: 0
        };
        
        // ── API Functions ──
        async function apiCall(endpoint, method = 'GET') {
            try {
                const response = await fetch(endpoint, { method });
                return await response.json();
            } catch (e) {
                console.error(`API error: ${endpoint}`, e);
                return { ok: false, error: e.message };
            }
        }
        
        // ── App Control ──
        async function appStart() {
            const result = await apiCall('/app/start', 'POST');
            if (result.ok) {
                appState.running = true;
                updateAppButtons();
            }
            updateStatus('appStatus', result.ok ? 'App started' : result.error);
        }
        
        async function appStop() {
            const result = await apiCall('/app/stop', 'POST');
            if (result.ok) {
                appState.running = false;
                updateAppButtons();
            }
            updateStatus('appStatus', result.ok ? 'App stopped' : result.error);
        }
        
        function updateAppButtons() {
            document.getElementById('appStartBtn').classList.toggle('active', appState.running);
            document.getElementById('appStopBtn').classList.toggle('active', !appState.running);
        }
        
        // ── Voice Control ──
        async function voiceOn() {
            await apiCall('/voice/on', 'POST');
            refreshStatus();
        }
        
        async function voiceOff() {
            await apiCall('/voice/off', 'POST');
            refreshStatus();
        }
        
        async function voiceTest() {
            const result = await apiCall('/voice/test', 'POST');
            updateStatus('voiceStatus', result.message || result.error || 'Sent');
        }
        
        // ── Audio Control ──
        async function audioAux() {
            const result = await apiCall('/audio/output/aux', 'POST');
            updateStatus('audioStatus', result.ok ? 'AUX selected' : result.error);
        }
        
        // ── Recording Control ──
        async function recordStart() {
            const minutes = document.getElementById('recMinutes').value || '5';
            const result = await apiCall(`/record/start?minutes=${encodeURIComponent(minutes)}`);
            updateStatus('recordStatus', result.ok ? `Recording ${minutes}m` : result.error);
        }
        
        async function recordStop() {
            const result = await apiCall('/record/stop', 'POST');
            updateStatus('recordStatus', result.ok ? 'Recording stopped' : result.error);
        }
        
        // ── Stabilization Control ──
        async function stabOn() {
            await apiCall('/video/stabilization/on', 'POST');
            refreshStatus();
        }
        
        async function stabOff() {
            await apiCall('/video/stabilization/off', 'POST');
            refreshStatus();
        }
        
        // ── Status Refresh ──
        async function refreshStatus() {
            // App status
            const ar = await apiCall('/app/status');
            if (ar.ok) {
                appState.running = ar.running;
                updateAppButtons();
            }
            
            // Voice status
            const vr = await apiCall('/voice/status');
            updateStatus('voiceStatus', vr.voice_enabled ? 'Voice: ON' : 'Voice: OFF');
            
            // Audio status
            updateStatus('audioStatus', 'Audio: ' + (vr.audio_output || 'unknown'));
            
            // Recording status
            const rr = await apiCall('/record/status');
            if (rr.recording) {
                updateStatus('recordStatus', `Recording: ${rr.seconds_left}s left`);
            } else {
                updateStatus('recordStatus', 'Ready');
            }
            
            // Stabilization status
            const sr = await apiCall('/video/stabilization/status');
            updateStatus('stabStatus', sr.stabilization_enabled ? 'Stabilization: ON' : 'Stabilization: OFF');
            
            // Sensor data
            const sensor_result = await apiCall('/sensor/status');
            if (sensor_result.ok && sensor_result.sensor) {
                const s = sensor_result.sensor;
                
                // ToF data (convert mm to cm)
                if (s.front_mm !== null) {
                    document.getElementById('tofDistance').textContent = (s.front_mm / 10).toFixed(1) + ' cm';
                } else {
                    document.getElementById('tofDistance').textContent = '∞ cm';
                }
                
                document.getElementById('tofValidCells').textContent = s.front_valid_cells || 0;
                
                // IMU data
                document.getElementById('imuPitch').textContent = (s.pitch_deg || 0).toFixed(1) + '°';
                document.getElementById('imuYaw').textContent = (s.yaw_deg || 0).toFixed(1) + '°';
                
                // System info
                const lastUpdate = new Date(s.last_update * 1000);
                document.getElementById('sensorUpdate').textContent = lastUpdate.toLocaleTimeString();
                document.getElementById('sensorError').textContent = s.error || 'None';
            }
        }
        
        function updateStatus(elementId, text) {
            const el = document.getElementById(elementId);
            if (el) {
                el.textContent = text;
            }
        }
        
        // ── Auto-refresh ──
        setInterval(refreshStatus, 1000);
        
        // ── Initial load ──
        refreshStatus();
        updateAppButtons();
    </script>
</body>
</html>
